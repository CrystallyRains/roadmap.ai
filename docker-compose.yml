# Self-hosted deployment target (EC2, Phase 2). Vercel remains the primary production.
# Builds the image directly from source on the host — no registry push yet.
# (see docs/AWS_DEPLOYMENT_PLAN.md "Phase 2.1" for that follow-up).
services:
  app:
    image: snigdhach/e-commerce-python:latest
    ports:
      - "80:3000"
    restart: unless-stopped
