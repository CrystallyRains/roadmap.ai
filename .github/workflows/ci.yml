name: Test & Build

on:
  workflow_call: 

jobs:
  test-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          AUTH_SECRET: ci-placeholder-secret
